# dsh-attention bundle。
# 安装: dsh plugin --profile web add dsh-attention
- insert:
    - id: dsh-attention
      name: dsh-attention
      config:
        enabled: true
        notifyApproval: true
        notifyQuestion: true
        notifyIdle: true
        notifySubagentIdle: false
        notifyStyle: custom
        notifyTimeoutSec: 30
        cardOpacity: 0.78
        openSessionMode: reuse
        hiddenReloadMs: 8000
        cooldownMs: 1500
