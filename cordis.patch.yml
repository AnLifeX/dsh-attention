# dsh-attention bundle。
# 安装: dsh plugin --profile web add dsh-attention
- insert:
    - id: dsh-attention
      name: dsh-attention
      config:
        enabled: true
        rootsOnly: true
        notifyApproval: true
        notifyQuestion: true
        notifyIdle: true
        notifyStyle: custom
        notifyTimeoutSec: 30
        openSessionMode: reuse
        webUrl: http://127.0.0.1:3080
        hiddenReloadMs: 8000
        cooldownMs: 1500
